name: TestFlight

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight?"
        required: false
        default: "true"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Signing ──────────────────────────────────────────────────────
      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install Provisioning Profile & Verify Signing
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | \
            base64 -d > "$PP_DIR/AppStore.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PP_DIR/AppStore.mobileprovision")")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "=== Keychain search list ==="
          security list-keychains -d user
          echo "=== Codesigning identities (all keychains) ==="
          security find-identity -v -p codesigning
          echo "=== Codesigning identities (signing_temp only) ==="
          security find-identity -v -p codesigning ~/Library/Keychains/signing_temp.keychain-db

      # ── Archive ──────────────────────────────────────────────────────
      - name: Clear SwiftPM Artifact Cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Archive iOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-iOS \
            -destination "generic/platform=iOS" \
            -archivePath build/HermesNative.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "HermesNative-iOS.PROVISIONING_PROFILE_SPECIFIER=${{ env.PROFILE_UUID }}" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/signing_temp.keychain-db"

      # ── Export ────────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.researchoors.HermesNative.iOS</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HermesNative.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      # ── Upload ────────────────────────────────────────────────────────
      - name: Find Current TestFlight Build
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: com.researchoors.HermesNative.iOS
        run: |
          CURRENT_BUILD=$(ruby .github/scripts/distribute_testflight.rb --print-latest-build)
          echo "PREVIOUS_BUILD_NUMBER=$CURRENT_BUILD" >> "$GITHUB_ENV"
          echo "Current latest build before upload: ${CURRENT_BUILD:-none}"

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -t ios \
            -f build/export/HermesNative-iOS.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Assign Build to TestFlight Groups
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: com.researchoors.HermesNative.iOS
          APP_VERSION: "1.0"
          PREVIOUS_BUILD_NUMBER: ${{ env.PREVIOUS_BUILD_NUMBER }}
          WHAT_TO_TEST: "HermesNative CI build from ${{ github.sha }}."
          MAX_WAIT_SECONDS: "900"
          POLL_SECONDS: "30"
        run: ruby .github/scripts/distribute_testflight.rb

      # ── Artifact ─────────────────────────────────────────────────────
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesNative-iOS.ipa
          path: build/export/HermesNative-iOS.ipa
          retention-days: 30

  # ── macOS Notarized Build (needs Developer ID cert, disabled for now) ──
  notarize-macos:
    name: Notarize macOS App
    runs-on: macos-26
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Archive macOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-macOS \
            -destination "generic/platform=macOS" \
            -archivePath build/HermesNative-macOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/signing_temp.keychain-db"

      - name: Export macOS App
        run: |
          cat > build/ExportOptions-macOS.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/HermesNative-macOS.xcarchive \
            -exportPath build/export-macos \
            -exportOptionsPlist build/ExportOptions-macOS.plist

      - name: Notarize
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ditto -c -k --keepParent \
            build/export-macos/HermesNative-macOS.app \
            build/HermesNative-macOS.zip

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun notarytool submit build/HermesNative-macOS.zip \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple build/export-macOS/HermesNative-macOS.app

      - name: Upload macOS App as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesNative-macOS.app
          path: build/export-macOS/HermesNative-macOS.app
          retention-days: 30
