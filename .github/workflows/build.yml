name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build 2>&1 | tee build.log
      - name: Verify build succeeded
        run: grep -q "Build complete" build.log
