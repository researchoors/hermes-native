name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS
        run: |
          xcodebuild build \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-macOS \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            | xcpretty || exit 1
      - name: Build iOS
        run: |
          xcodebuild build \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            | xcpretty || exit 1
