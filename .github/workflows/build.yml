name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        run: |
          # Runner images roll simulators forward (iPhone 16 -> 17 -> …); a
          # hardcoded name fails with "Unable to find a device matching the
          # destination". Resolve the newest available iPhone by UDID.
          SIM_ID=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9].*\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}' | tail -1)
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator UDID: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-macOS \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee build-macos.log | xcpretty

      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-ios-simulator.log | xcpretty

      - name: Run offline iOS Simulator UI smoke test
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/HermesNativeOfflineUITests.xcresult"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          xcodebuild test \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:HermesNativeUITests/HermesNativeOfflineSmokeUITests/testOnboardingRendersWithoutGatewaySecrets \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee ios-ui-offline-smoke.log | xcpretty

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-smoke-artifacts
          path: |
            ${{ runner.temp }}/HermesNativeOfflineUITests.xcresult
            ios-ui-offline-smoke.log
            build-ios-simulator.log
            build-macos.log
          if-no-files-found: ignore
          retention-days: 14
