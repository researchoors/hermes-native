name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Verify binary
        run: file .build/debug/HermesNative | grep -q "Mach-O 64-bit executable arm64"
