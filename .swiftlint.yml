included:
  - Sources
  - Tests

excluded:
  - .build
  - .git
  - google-cloud-sdk
  - App
  - Tests/HermesNativeUITests

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - overridden_super_call
  - private_outlet
  - vertical_whitespace_closing_braces
  - yoda_condition
  - function_name_whitespace

disabled_rules:
  - trailing_comma
  - type_body_length
  - file_length
  - function_body_length
  - function_parameter_count
  - large_tuple
  - cyclomatic_complexity
  - nesting
  - no_space_in_method_call
  - identifier_name
  - comma
  - force_cast
  - force_try
  - unused_closure_parameter
  - redundant_discardable_let
  - todo
  - control_statement
  - trailing_closure
  - syntactic_sugar
  - implicit_return
  - statement_position
  - operator_whitespace
  - vertical_parameter_alignment
  - mark

line_length:
  warning: 180
  error: 250
  ignores_comments: true
  ignores_urls: true

type_name:
  min_length: 2

vertical_whitespace:
  max_empty_lines: 2

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

custom_rules:
  no_nslog:
    regex: "\\bNSLog\\("
    message: "Use Logger from os.log instead of NSLog"
    severity: warning