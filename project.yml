name: HermesNative
options:
  bundleIdPrefix: com.researchoors
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.6.0"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.3.0"
  BeautifulMermaid:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    from: "1.0.0"

targets:
  HermesNative-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/HermesNative
      - path: App/MacApp.swift
    dependencies:
      - package: Lottie
      - package: Highlightr
      - package: BeautifulMermaid
    entitlements:
      path: HermesNative-macOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.researchoors.HermesNative.macOS
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  HermesNative-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/HermesNative
      - path: App/IOSApp.swift
    dependencies:
      - package: Lottie
      - package: Highlightr
      - package: BeautifulMermaid
    entitlements:
      path: HermesNative-iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.researchoors.HermesNative.iOS
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: ""
        INFOPLIST_KEY_NSAppTransportSecurity_AllowsArbitraryLoads: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
